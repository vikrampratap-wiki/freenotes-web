<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FreeNotes Web - Ultimate Free Digital Note-Taking</title>
    <meta name="description" content="Free, unlimited digital notebook with realistic pens, PDF annotation, templates, tape tool, and infinite creativity." />
    <meta property="og:title" content="FreeNotes Web - Ultimate Free Digital Note-Taking" />
    <meta property="og:description" content="Free, unlimited digital notebook with realistic pens, PDF annotation, templates, tape tool, and infinite creativity." />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.childElementCount === 0 && !window.__vite_plugin_react_preamble_installed__) {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './public/gh-pages/app.css';
            document.head.appendChild(css);

            const js = document.createElement('script');
            js.type = 'module';
            js.src = './public/gh-pages/app.js';
            document.body.appendChild(js);
          }
        }, 120);
      });
    </script>
  </body>
</html>
